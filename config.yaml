# hyphae local-dev configuration
# Derived from config.yaml.example — adjusted for local development.

# Management REST API
port: "8084"
address: "0.0.0.0"
base_path: "/api/v1"

# Logging — write to stderr for local dev (no log dir needed)
log_level: "debug"
log_format: "json"
log_to_stderr: true
log_to_file: false
log_file_path: "logs/hyphae.log"

# Public HTTPS gateway — leave cert/key empty to disable TLS in dev
public_gateway:
  port: "9443"
  tls_cert: ""
  tls_key: ""

# mTLS tunnel listener — leave ca_cert empty to skip client cert validation in dev
tunnel:
  port: "9090"
  ca_cert: ""

# Auth0 JWT validation — same tenant as server_api
auth:
  auth_domain: "dev-motk8gx6wyw7nmbr.us.auth0.com"
  auth_audience: "https://ambientdev.com/v1/api"

# Admin Unix socket (used by hyphctl)
admin_socket:
  enabled: true
  socket_path: "/tmp/hyphae_admin.sock"
