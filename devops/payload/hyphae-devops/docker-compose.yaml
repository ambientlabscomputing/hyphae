# Variable substitution is sourced from .env (gitignored).
# Copy .env.example → .env and fill in secrets before running 'make setup'.

services:
    hyphae:
        image: ambientlabsjose/hyphae:${HYPHAE_IMAGE_TAG:-develop}
        container_name: hyphae
        restart: unless-stopped
        ports:
            # 8084 (management API) is intentionally NOT published to the public internet.
            # For local OrbStack dev it is published to the VM host so server_api on the
            # Mac can reach it. In production, server_api reaches it over the private
            # network without ever exposing this port externally.
            - "8084:8084"    # management API (local dev — restrict at firewall in prod)
            - "9090:9090"   # tunnel listener (mTLS, inbound from MMA nodes)
            - "443:443"     # public HTTPS gateway
            - "8080:443"    # local dev: plain-HTTP gateway (bypasses OrbStack TLS interception on :443)
        environment:
            CONFIG_PATH: /etc/underleaf/config.yaml
            # Override secrets via env vars rather than committing them to config.yaml:
            # HYPHAE_AUTH_DOMAIN: your-tenant.auth0.com
            # HYPHAE_AUTH_AUDIENCE: https://hyphae.your-domain.com
        volumes:
            - ./hyphae/config.yaml:/etc/underleaf/config.yaml:ro
            # Certs are mounted directly from the Mac via OrbStack's /mnt/mac FUSE mount.
            # Set HYPHAE_CERTS_PATH in .env (e.g. /mnt/mac/Users/you/.../hyphae/certs).
            # This means certs only need to be created once on the Mac — no copying needed.
            - ${HYPHAE_CERTS_PATH}:/etc/underleaf/certs:ro
            # Log directory bind-mounted from Mac via /mnt/mac so logs persist and are
            # directly readable on the host without ssh-ing into the VM.
            # config.yaml.template writes to /var/log/underleaf/hyphae.log (container path).
            # Set HYPHAE_LOGS_PATH in .env (e.g. /mnt/mac/Users/you/.../hyphae/logs).
            - ${HYPHAE_LOGS_PATH}:/var/log/underleaf
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            # DAC_READ_SEARCH: read files owned by other users (/mnt/mac cert files).
            # DAC_OVERRIDE:    write files owned by other users (/mnt/mac log files).
            - DAC_READ_SEARCH
            - DAC_OVERRIDE
        deploy:
            resources:
                limits:
                    cpus: '2.0'
                    memory: 1G
                reservations:
                    cpus: '0.25'
                    memory: 128M
        networks:
            - hyphae-network
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8084/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s
    
    cf_tunnel:
        # Cloudflare tunnel — optional, start with 'make run-with-tunnel'.
        # CF_TUNNEL_TOKEN is sourced from .env. Obtain the token from the
        # Cloudflare Zero Trust dashboard under Tunnels → your tunnel → Install connector.
        image: cloudflare/cloudflared:latest
        container_name: cf_tunnel
        restart: unless-stopped
        profiles: ["tunnel"]
        command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
        networks:
            - hyphae-network


networks:
  hyphae-network:
    driver: bridge
