version: '3.8'

services:
  hyphae:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hyphae
    restart: unless-stopped
    ports:
      - "8084:8084"   # management API
      - "9090:9090"   # tunnel listener (mTLS, inbound from MMA nodes)
      - "443:443"     # public HTTPS gateway
    environment:
      CONFIG_PATH: /app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # Mount TLS certs directory (wildcard cert + platform CA)
      - ./certs:/app/certs:ro
    networks:
      - hyphae-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  hyphae-network:
    driver: bridge
